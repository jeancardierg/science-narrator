[project]
name = "science-narrator"
version = "0.1.0"
description = "Local voice-cloned, pronunciation-checked narration synced to existing video (Chatterbox + Whisper)"
readme = "README.md"
license = { text = "MIT" }
# chatterbox-tts pins torch 2.6 / numpy < 2 -> stay on 3.11 for painless wheels.
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "pyyaml>=6.0",
  "num2words>=0.5.13",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
tts = ["chatterbox-tts==0.1.7"]
# ASR round-trip check. mlx-whisper runs on the Apple Silicon GPU/ANE.
asr = [
  "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1.0; sys_platform != 'darwin'",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
narrator = "narrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
